
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ffb6cf, #ff6f9f, #ffc5dc);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: white;
}

.container {
    width: 90%;
    max-width: 420px;
    padding: 40px 25px;
    text-align: center;
    background: rgba(255,255,255,0.20);
    backdrop-filter: blur(15px);
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 30px;
    box-shadow: 0 15px 50px #b52b6544;
    z-index: 2;
    animation: appear 1.5s ease;
}

.small-text {
    letter-spacing: 5px;
    font-size: 12px;
    margin-bottom: 25px;
}

.heart {
    font-size: 100px;
    animation: heartbeat 1.2s infinite;
    filter: drop-shadow(0 0 20px #ff174f);
}

h1 {
    font-size: 38px;
    margin: 20px 0;
    text-shadow: 0 4px 15px #b82b61;
}

h1 span {
    color: #fff4f8;
}

.name {
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 20px;
}

.message {
    font-size: 15px;
    line-height: 1.9;
    color: #fff8fb;
    margin-bottom: 25px;
}

button {
    padding: 15px 30px;
    border: none;
    border-radius: 50px;
    background: white;
    color: #ed4381;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 20px #b52b6544;
    transition: .3s;
}

button:hover {
    transform: scale(1.08);
    background: #ffe6ef;
}

#surprise {
    display: none;
    margin-top: 25px;
    font-size: 19px;
    line-height: 1.8;
    animation: appear 1s ease;
}

.signature {
    margin-top: 30px;
    font-size: 14px;
    letter-spacing: 2px;
}

/* FLOATING HEARTS */

.floating-heart {
    position: absolute;
    bottom: -50px;
    animation: floatUp linear infinite;
    opacity: .8;
    pointer-events: none;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

@keyframes floatUp {
    from {
        transform: translateY(0) rotate(0);
        opacity: 0;
    }
    20% { opacity: .8; }
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

    <p class="small-text">A SPECIAL MESSAGE FOR YOU</p>

    <div class="heart">❤️</div>

    <h1>I LOVE <span>YOU!</span></h1>

    <div class="name">FOREVER & ALWAYS 💗</div>

    <p class="message">
        You are a special part of this beautiful world.
        May your days always be filled with happiness,
        love, and countless reasons to smile. 🌸
    </p>

    <button onclick="showLove()">
        Open My Message 💌
    </button>

    <div id="surprise">
        I LOVE YOU SO MUCH! ❤️<br>
        Sending you hugs, happiness, and sweet memories. 🥰
    </div>

    <div class="signature">
        WITH LOVE,<br>
        <strong> CAMS SHBBN 💕 </strong>
    </div>

</div>

<script>

// Surprise message
function showLove() {
    document.getElementById("surprise").style.display = "block";
}

// Floating hearts
const hearts = ["❤️", "💕", "💗", "💖", "💘", "🌸"];

function createHeart() {
    const heart = document.createElement("div");

    heart.className = "floating-heart";
    heart.innerHTML = hearts[
        Math.floor(Math.random() * hearts.length)
    ];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 25) + "px";
    heart.style.animationDuration = (4 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 9000);
}

setInterval(createHeart, 400);

</script>

</body>
</html>
